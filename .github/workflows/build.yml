name: Build LomoKino Studio
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macOS-arm64
          - runner: macos-15-intel
            name: macOS-x64
          - runner: windows-2022
            name: Windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements_gui.txt "pyinstaller>=6.10,<7"
      - name: Pixel geometry, project and video regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit supplied scans
        run: python scripts/validate_demo.py
      - name: Build with bundled FFmpeg
        run: python -m PyInstaller --noconfirm lomokino_gui.spec
      - name: Verify packaged encoder on macOS
        if: runner.os == 'macOS'
        run: dist/LomoKinoGUI.app/Contents/MacOS/LomoKinoGUI --self-test "${{ runner.temp }}/lomokino-package-check"
      - name: Verify packaged encoder on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/LomoKinoGUI/LomoKinoGUI.exe" -ArgumentList @('--self-test', "${{ runner.temp }}/lomokino-package-check") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content "${{ runner.temp }}/lomokino-package-check/error.txt"
            exit 1
          }
      - name: Sign and archive macOS application
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/LomoKinoGUI.app
          ditto -c -k --sequesterRsrc --keepParent dist/LomoKinoGUI.app dist/LomoKinoStudio-${{ matrix.name }}.zip
      - name: Archive Windows application and dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/LomoKinoGUI -DestinationPath dist/LomoKinoStudio-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LomoKinoStudio-${{ matrix.name }}
          path: dist/LomoKinoStudio-*.zip
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LomoKinoStudio-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
